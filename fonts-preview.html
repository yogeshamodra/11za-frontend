<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Heading font preview</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
@font-face{font-family:"Fira Sans";font-weight:400;src:url(assets/fonts/firasans-regular.ttf)}
@font-face{font-family:"Fira Sans";font-weight:500;src:url(assets/fonts/FiraSans-Medium.ttf)}
@font-face{font-family:"Fira Sans";font-weight:600;src:url(assets/fonts/FiraSans-SemiBold.ttf)}
@font-face{font-family:"Fira Sans";font-weight:700;src:url(assets/fonts/FiraSans-Bold.ttf)}
@font-face{font-family:"IBM Plex Serif";font-weight:500;src:url(assets/fonts/IBMPlexSerif-Medium.ttf)}
@font-face{font-family:"IBM Plex Serif";font-weight:600;src:url(assets/fonts/IBMPlexSerif-SemiBold.ttf)}
@font-face{font-family:"IBM Plex Serif";font-weight:700;src:url(assets/fonts/ibmplexserif-bold.ttf)}
@font-face{font-family:"Instrument Serif";font-weight:400;src:url(assets/fonts/InstrumentSerif-Regular.ttf)}
@font-face{font-family:"Hedvig Letters Serif";font-weight:400;src:url(assets/fonts/hedvig-letter-regular.ttf)}
@font-face{font-family:"Faustina";font-weight:400;src:url(assets/fonts/faustina-regular.ttf)}
body{margin:0;background:#f4f7f4;font-family:"Fira Sans",sans-serif;color:#0f172a}
.card{background:#064e3b;color:#fff;margin:16px auto;max-width:900px;padding:28px 32px;border-radius:16px}
.card small{display:block;opacity:.7;font-size:13px;margin-bottom:8px}
h1{margin:0 0 8px;font-size:clamp(2.2rem,5vw,3.7rem);line-height:1.1}
h3{margin:14px 0 4px;font-size:1.4rem}
p{margin:0;opacity:.85;font-size:1rem}
</style></head><body>
<script>
const f=[
 ["Fira Sans 600 (sans-serif, modern SaaS)",'"Fira Sans"',600],
 ["IBM Plex Serif 600",'"IBM Plex Serif"',600],
 ["IBM Plex Serif 500",'"IBM Plex Serif"',500],
 ["Instrument Serif 400 (editorial)",'"Instrument Serif"',400],
 ["Hedvig Letters Serif 400",'"Hedvig Letters Serif"',400],
 ["Faustina 400",'"Faustina"',400]];
f.forEach(([n,ff,w])=>document.body.insertAdjacentHTML("beforeend",
`<div class="card"><small>${n}</small><h1 style="font-family:${ff};font-weight:${w}">Unlock Business Growth</h1>
<h3 style="font-family:${ff};font-weight:${w}">Shared Team Inbox on one number</h3>
<p>Confirm COD orders, recover abandoned carts and run personalised campaigns automatically.</p></div>`));
</script></body></html>
